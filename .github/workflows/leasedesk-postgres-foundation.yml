name: LeaseDesk Postgres Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/leasedesk-postgres-foundation.yml"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "drizzle.config.ts"

permissions:
  contents: read

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leasedesk
          POSTGRES_PASSWORD: leasedesk
          POSTGRES_DB: leasedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leasedesk -d leasedesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leasedesk:leasedesk@localhost:5432/leasedesk
      LEASEDESK_MODE: production
      SESSION_SECRET: leasedesk-postgres-foundation-ci-session-secret
      LEASEDESK_ADMIN_USERNAME: owner
      LEASEDESK_ADMIN_PASSWORD: correct-password
      LEASEDESK_UPLOAD_DIR: /tmp/leasedesk-postgres-foundation-uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test
        env:
          LEASEDESK_MODE: demo

      - name: Build
        run: npm run build

      - name: Initialise clean Postgres schema
        run: mkdir -p "$LEASEDESK_UPLOAD_DIR" && npm run db:push -- --force

      - name: Verify Postgres persistence and session storage
        run: npm run test:postgres
        env:
          LEASEDESK_RUN_POSTGRES_TESTS: "1"
